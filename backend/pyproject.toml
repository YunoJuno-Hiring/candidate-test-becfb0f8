[project]
dependencies = [
  "Django>=5.1,<6.0",
  "djangorestframework>=3.15,<4.0",
  "psycopg[binary]>=3.2",
  "python-decouple>=3.8",
]
name = "yunojuno-backend"
requires-python = ">=3.14"
version = "0.1.0"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
